<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Gnist — Moderne Dating &amp; Live Møter</title>
    <meta
      name="description"
      content="Mobiloptimalisert norsk dating-app (PWA) med utforskerrutenett, berøringsvennlig sveiping, hvem likte deg, sanntids live-strømming, direktemeldinger med icebreakers og selfie-verifisering."
    />
    <meta property="og:title" content="Gnist — Moderne Dating &amp; Live Møter" />
    <meta
      property="og:description"
      content="Mobiloptimalisert norsk dating-app (PWA) med utforskerrutenett, berøringsvennlig sveiping, hvem likte deg, sanntids live-strømming, direktemeldinger med icebreakers og selfie-verifisering."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#FAFAFA" id="gnist-theme-color" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Gnist" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('gnist-theme-mode');
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark =
            saved === 'dark' || ((saved === 'system' || !saved) && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
            var meta = document.getElementById('gnist-theme-color');
            if (meta) meta.setAttribute('content', '#09090B');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 antialiased selection:bg-rose-100 selection:text-rose-900 dark:selection:bg-rose-950 dark:selection:text-rose-200 transition-colors duration-150">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
